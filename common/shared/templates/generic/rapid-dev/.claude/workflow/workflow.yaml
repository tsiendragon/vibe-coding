apiVersion: wop/v0.3
kind: Workflow
metadata:
  name: rapid-development
  version: 0.2.0
  description: "快速开发工作流 - 15分钟内启动项目，2-4小时完成MVP"

extends:
  base: "@global/workflows/basic-dev.yaml"    # 继承基础开发流程
  modifications:
    - remove_stages: ["detailed_planning", "comprehensive_testing", "security_audit"]
    - add_stages: ["quick_validation", "rapid_deployment"]
    - override_params:
        review_timeout: "10m"                 # 审查超时设为10分钟
        deploy_strategy: "fast_deploy"        # 快速部署策略
        quality_gate: "basic"                 # 基础质量门

# 快速开发专用参数
params:
  prototype_mode: true                       # 开启原型模式
  max_iteration_time: "4h"                  # 最大迭代时间4小时
  mvp_target_time: "1h"                     # MVP目标完成时间1小时
  quick_validation: true                     # 启用快速验证
  feedback_cycle: "30m"                     # 30分钟反馈周期

# 全局配置
refs:
  standards:
    - id: std.rapid.basic
      name: "快速开发基础规范"
      uri: "@templates/rapid-dev/standards/rapid-dev.md"
      enforce:
        when: ["quick_start", "rapid_build", "quick_validation"]

  commands:
    - id: cmd.quick_start
      agent: dev-assistant
      mode: chat
      signature: "/quick-start --idea=${idea} --time-limit=${max_iteration_time}"

    - id: cmd.generate_mvp
      agent: dev-assistant
      mode: chat
      signature: "/generate-mvp --features=${core_features} --time=${mvp_target_time}"

    - id: cmd.quick_deploy
      agent: dev-assistant
      mode: shell
      signature: "/quick-deploy --env=staging --validate --timeout=5m"

agents:
  - { id: dev-assistant, role: RapidDevelopmentAgent }
  - { id: 主agent, role: HostAgent }

# 快速开发阶段
stages:
  - id: kickoff
    name: "快速启动"
    steps: [quick_ideation, rapid_setup]

  - id: rapid_build
    name: "快速构建"
    steps: [mvp_generation, iterative_dev]

  - id: validation
    name: "快速验证"
    steps: [quick_deploy, user_feedback]

steps:
  # 1) 快速构思和设置
  - id: quick_ideation
    name: "快速构思"
    agent: dev-assistant
    run:
      type: chat
      command: "/quick-start --idea=${params.idea} --time-limit=${params.max_iteration_time}"
    outputs:
      files: ["project_brief.md", "core_features.json"]
    next: [rapid_setup]

  - id: rapid_setup
    name: "快速环境设置"
    agent: dev-assistant
    run:
      type: shell
      command: "/setup-rapid-env --template=minimal --auto-install"
    outputs:
      files: ["project_structure/", "package.json", "requirements.txt"]
    next: [mvp_generation]

  # 2) MVP生成
  - id: mvp_generation
    name: "MVP生成"
    agent: dev-assistant
    run:
      type: chat
      command: "/generate-mvp --features=${core_features} --time=${params.mvp_target_time}"
    outputs:
      files: ["src/", "README.md", "mvp_demo.md"]
    gates:
      - type: approval
        id: g_mvp_review
        approvers: ["用户"]
        prompt: "MVP功能是否符合预期？可以开始迭代吗？"
        timeout: "5m"
    next: [iterative_dev]

  # 3) 快速迭代开发
  - id: iterative_dev
    name: "迭代开发"
    agent: dev-assistant
    loop:
      mode: while
      condition: "iteration_time < ${params.max_iteration_time}"
      max_iterations: 4
      body:
        type: composite
        steps:
          - type: chat
            command: "/iterate --cycle=${loop.index} --focus=${iteration_focus} --time=30m"
          - type: gate
            gate:
              type: approval
              id: "g_iteration_${loop.index}"
              approvers: ["用户"]
              prompt: "第${loop.index}次迭代完成，继续下一轮吗？"
              timeout: "3m"
          - type: shell
            command: "/quick-test --fast --essential-only"
    next: [quick_deploy]

  # 4) 快速部署
  - id: quick_deploy
    name: "快速部署"
    agent: dev-assistant
    run:
      type: shell
      command: "/quick-deploy --env=staging --validate --timeout=5m"
    outputs:
      files: ["deployment_url.txt", "deploy_status.json"]
    next: [user_feedback]

  # 5) 用户反馈收集
  - id: user_feedback
    name: "用户反馈"
    agent: dev-assistant
    run:
      type: chat
      command: "/collect-feedback --url=${deployment_url} --duration=15m"
    outputs:
      files: ["user_feedback.md", "next_iteration.json"]

# 输出产物
artifacts:
  mvp_demo: "mvp_demo.md"
  deployment_url: "deployment_url.txt"
  iteration_log: "artifacts/iteration_log.json"
  feedback_summary: "artifacts/feedback_summary.md"
